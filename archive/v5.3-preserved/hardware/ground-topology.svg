<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1050" viewBox="0 0 1240 1050" id="ground-topology-svg" role="img" aria-label="P0 부하 / G0 로직·MP3·홍싱 / PE 보호접지"><style>text{font-family:"Malgun Gothic",Arial,sans-serif}.device{cursor:pointer;outline:none}.selected-device{filter:drop-shadow(0 0 4px #16a798)}.selected-net{stroke-width:5!important;opacity:1!important}.dim-net{opacity:.18}.power-net{display:none}.show-power .power-net{display:initial}</style>
<rect x="0" y="0" width="1240" height="1050" rx="0" fill="#f8fafc" stroke="none" />
<text x="35" y="48" font-size="28" font-weight="650" fill="#405e70" text-anchor="start">GND · 직접 이어지는 선과 절연 경계를 구별</text>
<text x="35" y="82" font-size="17" font-weight="500" fill="#8296a2" text-anchor="start">P0/G0 공통 기준선 있음 · 귀환 분배는 절연이 아닙니다 · 자석−도 공통입니다.</text>
