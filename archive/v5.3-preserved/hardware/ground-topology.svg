<text x="50" y="953" font-size="17" font-weight="500" fill="#405e70" text-anchor="start">홍싱 전원−는 G0와 공통. 전원+는5L과 합치지 않음</text>
<rect x="600" y="850" width="610" height="145" rx="8" fill="#f3f7ee" stroke="#79984a" />
<text x="620" y="885" font-size="23" font-weight="500" fill="#79984a" text-anchor="start">PE · 콘센트 보호접지</text>
<text x="620" y="920" font-size="18" font-weight="500" fill="#405e70" text-anchor="start">기존 PE → SMPS FG / 금속 외함 / 도어</text>
<text x="620" y="953" font-size="17" font-weight="500" fill="#405e70" text-anchor="start">P0·G0 귀환 대용 금지 · 보호접지를 끊어 절연하지 않음</text>
<text x="35" y="1030" font-size="17" font-weight="500" fill="#879ba7" text-anchor="start">이 모델은 공통0V의 귀환 분기를 표시합니다. 기생용량·전자파·공유 AC 전원 변동까지 0이 되는 것은 아닙니다.</text>
